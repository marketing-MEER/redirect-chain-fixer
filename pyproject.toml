[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "redirect-chain-fixer"
version = "1.0.0"
description = "Find redirect chains and loops and output the direct-redirect rules"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "redirect", "chain", "fixer"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/redirect-chain-fixer"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
redirect-chain-fixer = "redirect_chain_fixer.cli:main"

[tool.setuptools]
packages = ["redirect_chain_fixer"]
